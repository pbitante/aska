name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  panel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
      - run: npm run check
  paseo-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paseo-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: paseo-plugin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Integration tests against ../panel's CLI
        run: npm test -- tests/integration
        env:
          ASKA_IT: "1"
      - name: Mobile audit (client/ must not touch the DOM)
        run: |
          if grep -rnE 'document\.|window\.|localStorage|navigator\.|<[a-z]+[ >]|className=|onClick=' client/; then exit 1; fi
